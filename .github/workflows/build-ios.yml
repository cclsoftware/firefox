name: "Continuous build (iOS)"

on:
  push:
    branches:
      - 'ccl-*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-26
            platform: ios

          - os: macos-26
            config: Simulator
            platform: ios-sim

      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          rustup target add aarch64-apple-ios
          rustup target add aarch64-apple-ios-sim
          rustup target add x86_64-apple-ios

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Bootstrap build environment
        run: |
          ./mach --no-interactive bootstrap --application-choice "SpiderMonkey JavaScript engine"

      - name: Build SpiderMonkey
        run: |
          python3.11 ./build/ccl/build_spidermonkey.py --platform ${{ matrix.platform }}

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: SpiderMonkey iOS ${{ matrix.config }}
          path: spidermonkey*.zip
